<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ماس 💎</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--i:#9fe8ff;--r:#ffc0d9;--v:#c9b3ff;--g:#ffe9b0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;color:#f2f6ff;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:radial-gradient(circle at 50% 0,#1d2c5c 0,#0a0f26 48%,#04050f 100%)}
button{font-family:inherit}
.ttl{font-family:'Aref Ruqaa','Cairo',serif}
#bg{position:fixed;inset:0;z-index:0}
.au{position:fixed;width:90vmax;height:90vmax;border-radius:50%;z-index:0;opacity:.3;pointer-events:none;animation:dr 20s ease-in-out infinite alternate}
.a1{background:radial-gradient(circle,#4fb8ff,transparent 60%);top:-50vmax;left:-35vmax}
.a2{background:radial-gradient(circle,#ff6fb0,transparent 60%);bottom:-55vmax;right:-35vmax;animation-delay:-8s}
.a3{background:radial-gradient(circle,#9a7bff,transparent 60%);top:25vh;left:35vw;opacity:.16;animation-delay:-13s}
@keyframes dr{to{transform:translate(12vmax,8vmax) rotate(40deg) scale(1.15)}}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.p{position:fixed;animation:pf 1s ease-out forwards;transform:translate(-50%,-50%);font-style:normal}
@keyframes pf{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3) rotate(240deg);opacity:0}}
.cf{position:fixed;top:-16px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.scr{position:fixed;inset:0;z-index:2;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transform:translateY(22px) scale(.97);transition:opacity .5s,transform .5s,visibility .5s}
.scr.on{opacity:1;visibility:visible;transform:none}
.gl{border:1px solid transparent;border-radius:24px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
 background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04)) padding-box,linear-gradient(135deg,var(--i),var(--r),var(--v)) border-box;
 box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22),0 0 34px rgba(159,232,255,.12)}
.btn{font-weight:900;font-size:1.1rem;border:0;border-radius:50px;padding:14px 34px;color:#102040;cursor:pointer;background:linear-gradient(135deg,#e8fbff,var(--i) 45%,var(--r));box-shadow:0 0 26px rgba(159,232,255,.6);transition:transform .15s;animation:gp 2.4s infinite}
.btn:active{transform:scale(.9)}
.btn:disabled{filter:grayscale(1) brightness(.5);box-shadow:none;animation:none}
@keyframes gp{50%{box-shadow:0 0 48px rgba(255,192,217,.85)}}
.sm{border:1px solid rgba(159,232,255,.5);background:rgba(255,255,255,.08);color:var(--i);border-radius:30px;padding:8px 16px;font-weight:700;cursor:pointer}
.sm:active{transform:scale(.92)}
.rise{opacity:0;animation:ri .9s var(--d) forwards}
@keyframes ri{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}to{transform:scale(1);opacity:1}}
@keyframes fl{50%{transform:translateY(-12px) rotate(3deg)}}
.dm{width:110px;height:100px;animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(159,232,255,.85))}
.nm{font-size:clamp(5rem,28vw,9rem);line-height:1.1;background:linear-gradient(90deg,#fff,var(--i),var(--r),var(--v),#fff);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite;padding:0 10px}
@keyframes sh{to{background-position:250%}}
#wl .wc{margin:auto;text-align:center;max-width:420px;padding:10px}
#wl p{margin:10px 0 26px;line-height:2;color:#d8e6ff;font-family:'Amiri',serif;font-size:1.3rem}
#menu h2{font-size:2.2rem;color:var(--i);margin:6px 0}
.pg{width:100%;max-width:520px;height:12px;border-radius:12px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 4px;border:1px solid rgba(159,232,255,.3)}
.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--i),var(--r),var(--v));transition:width .8s;box-shadow:0 0 12px var(--i)}
.lst{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;margin:12px 0 20px}
.gc{display:flex;align-items:center;gap:14px;padding:14px;text-align:right;color:inherit;cursor:pointer;width:100%;font-size:1rem;transition:transform .2s}
.gc:active{transform:scale(.96)}
.gc .ic{font-size:2.1rem;width:62px;height:62px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:18px;background:radial-gradient(circle,rgba(159,232,255,.35),rgba(0,0,0,.3));border:1px solid rgba(159,232,255,.5)}
.gc b{display:block;font-size:1.15rem;color:#fff}
.gc small{color:#b9cdf0}
.gc em{margin-right:auto;font-style:normal;font-size:.75rem;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:#b9cdf0;white-space:nowrap}
.gc.dn{box-shadow:0 0 26px rgba(255,192,217,.4)}
.gc.dn em{background:linear-gradient(90deg,var(--i),var(--r));color:#102040;font-weight:700}
.tb{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px;margin-bottom:12px}
.tb h3{font-size:1.3rem;color:var(--i)}
#gb{width:100%;max-width:520px}
.hud{display:flex;justify-content:space-between;padding:10px 18px;margin-bottom:12px;border-radius:50px}
.hud b{color:var(--r);font-size:1.15rem}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;perspective:800px}
.cd{aspect-ratio:3/4;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.cd.fl .in{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:2rem}
.bk{background:linear-gradient(135deg,#243b7a,#0d1530);border:1px solid rgba(159,232,255,.6);color:var(--i);box-shadow:inset 0 0 14px rgba(159,232,255,.3)}
.ft{transform:rotateY(180deg);background:linear-gradient(135deg,#f4fcff,#ffe0ee)}
.cd.ok .ft{box-shadow:0 0 22px var(--i);border:2px solid var(--i)}
.cd.bad .in{animation:sh3 .4s}
@keyframes sh3{25%{transform:rotateY(180deg) translateX(-7px)}75%{transform:rotateY(180deg) translateX(7px)}}
.ar{position:relative;height:56vh;min-height:300px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 100%,rgba(159,232,255,.2),rgba(0,0,0,.25));border:1px solid rgba(159,232,255,.3)}
.it{position:absolute;font-size:2.5rem;padding:10px;cursor:pointer;filter:drop-shadow(0 0 10px var(--i))}
.dr{top:-70px;animation:dn linear forwards}
@keyframes dn{to{transform:translateY(calc(56vh + 90px)) rotate(40deg)}}
.hr{bottom:-70px;animation:up linear forwards}
@keyframes up{to{transform:translateY(calc(-56vh - 100px)) rotate(-12deg)}}
.qq{padding:22px 18px}
.qq h3{font-size:1.3rem;line-height:1.8;margin-bottom:16px;text-align:center;font-family:'Amiri',serif}
.op{display:block;width:100%;margin:10px 0;padding:14px;border-radius:16px;font-size:1.1rem;font-weight:700;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(159,232,255,.5);cursor:pointer;transition:transform .15s}
.op:active{transform:scale(.96)}
.op.ok{background:linear-gradient(135deg,#ff8fc0,#9a7bff);border-color:#fff;animation:pop .4s}
.rp{margin-top:14px;text-align:center;font-family:'Amiri',serif;font-size:1.25rem;line-height:1.9;color:var(--g);min-height:60px;animation:pop .5s}
.sw{position:relative;height:210px;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font:700 1.5rem/2 'Amiri',serif;color:#102040;background:linear-gradient(135deg,#e8fbff,#ffd6e8,#dccbff)}
.sw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .8s}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(4,5,15,.8);opacity:0;visibility:hidden;transition:.4s;padding:20px}
.ov.on{opacity:1;visibility:visible}
.ov .gl{padding:28px 22px;text-align:center;max-width:360px;width:100%}
.ov.on .gl{animation:pop .5s}
.big{font-size:4rem;filter:drop-shadow(0 0 16px var(--i))}
.ov h2{font-size:2rem;color:var(--i);margin:6px 0}
.ov p{margin-bottom:18px;line-height:1.9;color:#e5eeff;font-family:'Amiri',serif;font-size:1.2rem}
.ov .btn{display:block;width:100%;margin:10px 0;font-size:1rem}
#final{background:radial-gradient(circle at 50% 20%,#4a1d52 0,#1a1038 55%,#05030d 100%)}
.rays{position:fixed;inset:-60%;z-index:-1;background:repeating-conic-gradient(rgba(255,214,235,.1) 0 6deg,transparent 6deg 16deg);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fw{margin:auto;text-align:center;max-width:440px;width:100%;padding:10px 0}
.fm{margin:16px 0;padding:22px 18px;line-height:2.1;font-size:1.4rem;font-family:'Amiri',serif}
.fm span{display:block;opacity:0;animation:ri .9s var(--d) forwards;padding:4px 0}
.rb{padding:22px;margin:22px 0;text-align:center}
.rb h2{font-family:'Amiri',serif;font-size:1.8rem;color:var(--r);margin-bottom:8px}
.rb p{color:#d8e6ff;margin-bottom:14px;line-height:1.8}
.rb textarea{width:100%;min-height:150px;resize:vertical;border:1px solid rgba(159,232,255,.5);border-radius:16px;padding:15px;background:rgba(0,0,0,.35);color:#fff;font:1.2rem 'Amiri',serif;outline:none;text-align:right;user-select:text;-webkit-user-select:text}
.rb textarea:focus{border-color:var(--r);box-shadow:0 0 18px rgba(255,192,217,.3)}
.rb .btn{margin-top:14px}
#rs{margin-top:12px;color:var(--g);min-height:24px;font-size:.95rem}
.fb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
#mute{position:fixed;bottom:12px;left:12px;z-index:30;padding:6px 12px;font-size:1.1rem}
@media(max-width:380px){.fm{font-size:1.2rem}.mg{gap:7px}}
@media(prefers-reduced-motion:reduce){.au,.rays,.dm{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="au a1"></div><div class="au a2"></div><div class="au a3"></div>
<div id="fx"></div>
<button class="sm" id="mute" type="button" aria-label="الصوت">🔊</button>

<section class="scr on" id="wl"><div class="wc">
 <div class="rise" style="--d:.1s"><svg class="dm" viewBox="0 0 100 90"><polygon points="25,5 38,35 2,35" fill="#d6f4ff"/><polygon points="25,5 75,5 62,35 38,35" fill="#fff"/><polygon points="75,5 98,35 62,35" fill="#ffd3e6"/><polygon points="2,35 38,35 50,88" fill="#8fd0f5"/><polygon points="38,35 62,35 50,88" fill="#c4ecff"/><polygon points="62,35 98,35 50,88" fill="#ffb6d5"/><polygon points="25,5 75,5 98,35 50,88 2,35" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
 <div class="rise" style="--d:.4s"><h1 class="ttl nm">ماس</h1></div>
 <p class="rise" style="--d:.9s">في عالم صغير اتعمل مخصوص عشانك…<br>فيه ألعاب وضحك ومفاجآت، وفي الآخر رسالة مستنياكي ✨</p>
 <div class="rise" style="--d:1.3s"><button class="btn" id="go">ادخلي عالمك 💎</button></div>
</div></section>

<section class="scr" id="menu">
 <h2 class="ttl">مراحل ماس</h2>
 <div class="pg"><i id="pb"></i></div>
 <div id="pt" style="color:#b9cdf0;font-size:.9rem">0 من 5 مراحل مكتملة</div>
 <div class="lst" id="lst"></div>
 <button class="btn" id="fbtn" disabled>💌 افتحي رسالتك</button>
 <div style="height:50px;flex:none"></div>
</section>

<section class="scr" id="game">
 <div class="tb"><button class="sm" id="bk">↩ المراحل</button><h3 class="ttl" id="gt"></h3></div>
 <div id="gb"></div>
 <div class="ov" id="ov"></div>
</section>

<section class="scr" id="final"><div class="rays"></div><div class="fw" id="fin"></div></section>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var R=function(a,b){return Math.random()*(b-a)+a};
var pick=function(a){return a[Math.random()*a.length|0]};
var fx=$("#fx"),gb=$("#gb"),ov=$("#ov");

/* glints background */
var cv=$("#bg"),cx=cv.getContext("2d"),W=0,H=0,S=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;S=[];
 for(var i=0;i<Math.min(55,W*H/14000|0);i++)S.push({x:R(0,W),y:R(0,H),r:R(3,9),p:R(0,6),s:R(.015,.05),v:R(.05,.2),c:pick(["#fff","#9fe8ff","#ffc0d9","#c9b3ff"])})}
function dw(){cx.clearRect(0,0,W,H);
 S.forEach(function(o){o.p+=o.s;o.y-=o.v;if(o.y<-10)o.y=H+10;
  var k=Math.abs(Math.sin(o.p)),s=o.r*k;cx.globalAlpha=.25+.75*k;cx.fillStyle=o.c;cx.beginPath();
  cx.moveTo(o.x,o.y-s);cx.quadraticCurveTo(o.x,o.y,o.x+s,o.y);cx.quadraticCurveTo(o.x,o.y,o.x,o.y+s);cx.quadraticCurveTo(o.x,o.y,o.x-s,o.y);cx.quadraticCurveTo(o.x,o.y,o.x,o.y-s);cx.fill()});
 requestAnimationFrame(dw)}
rs();dw();addEventListener("resize",rs);

/* effects */
function burst(x,y,ch,n,d){n=n||10;d=d||90;
 for(var i=0;i<n;i++){var e=document.createElement("i");e.className="p";e.textContent=pick(ch);var a=R(0,6.28),r=R(d*.4,d);
  e.style.cssText="left:"+x+"px;top:"+y+"px;font-size:"+R(14,26)+"px;--dx:"+Math.cos(a)*r+"px;--dy:"+Math.sin(a)*r+"px";
  fx.appendChild(e);setTimeout(function(el){el.remove()}.bind(null,e),1000)}}
var COLS=["#9fe8ff","#ffc0d9","#c9b3ff","#ffe9b0","#fff"];
function cf(n){for(var i=0;i<n;i++){var e=document.createElement("i");e.className="cf";
 e.style.cssText="left:"+R(0,100)+"vw;background:"+pick(COLS)+";animation-duration:"+R(2,4)+"s;animation-delay:"+R(0,.8)+"s";
 fx.appendChild(e);setTimeout(function(el){el.remove()}.bind(null,e),5000)}}
function center(el){var r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}

/* sound (WebAudio, no files) */
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(AC&&AC.state==="suspended"){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,ty,v,dl,to){var a=ac();if(!a||muted)return;var t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();
 o.type=ty||"sine";o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
var SFX={tap:function(){tone(700,.08,"sine",.08)},flip:function(){tone(420,.12,"triangle",.1,0,820)},
 match:function(){tone(660,.15,"sine",.12);tone(880,.2,"sine",.12,.1);tone(1320,.3,"sine",.1,.2)},
 wrong:function(){tone(220,.25,"sawtooth",.05,0,110)},
 gem:function(n){tone(900+n*40,.25,"sine",.12,0,1700);tone(2000,.1,"triangle",.04,.06)},
 ok:function(){tone(784,.12,"sine",.12);tone(1047,.25,"sine",.12,.1)},
 win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.4,"triangle",.12,i*.12)})}};
document.addEventListener("pointerdown",function(e){ac();if(e.target.closest&&e.target.closest(".btn,.sm,.gc")&&!e.target.closest("#mute"))SFX.tap()},true);
$("#mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";if(!muted){ac();SFX.tap()}};

/* state */
var TM=[],IV=[],FI=null,won=false,cur=-1,done=[0,0,0,0,0];
function tm(f,ms){var i=setTimeout(f,ms);TM.push(i);return i}
function iv(f,ms){var i=setInterval(f,ms);IV.push(i);return i}
function halt(){TM.forEach(clearTimeout);IV.forEach(clearInterval);TM=[];IV=[]}
function stop(){halt();gb.innerHTML="";ov.classList.remove("on")}
function show(id){document.querySelectorAll(".scr").forEach(function(s){s.classList.toggle("on",s.id===id)});var sc=document.getElementById(id);if(sc)sc.scrollTop=0}
var meta=[["🃏","ذاكرة الألماس","طابقي الكروت اللامعة"],["💎","صيد الألماس","اجمعي 12 ألماسة نازلة من السما"],["🔮","أسئلة عن ماس","3 أسئلة… وكل إجاباتها صح"],["💖","قلوب طايرة","فرقعي 10 قلوب"],["✨","كرت الحظ","اكشطي واكتشفي المفاجأة"]];
function renderMenu(){var n=done.reduce(function(a,b){return a+b},0);
 $("#pb").style.width=n*20+"%";$("#pt").textContent=n+" من 5 مراحل مكتملة";
 $("#lst").innerHTML=meta.map(function(m,i){return '<button class="gl gc'+(done[i]?" dn":"")+'" data-i="'+i+'"><span class="ic">'+m[0]+'</span><span><b>'+m[1]+'</b><small>'+m[2]+'</small></span><em>'+(done[i]?"✅ مكتملة":"المرحلة "+(i+1))+'</em></button>'}).join("");
 $("#fbtn").disabled=n<5}
$("#lst").addEventListener("click",function(e){var b=e.target.closest(".gc");if(b)openG(+b.dataset.i)});
function openG(i){stop();won=false;cur=i;$("#gt").textContent=meta[i][1];G[i]();show("game")}
function toMenu(){stop();clearInterval(FI);cur=-1;renderMenu();show("menu")}
function toFinal(){stop();show("final");startFinal()}
$("#bk").onclick=toMenu;$("#fbtn").onclick=toFinal;
$("#go").onclick=function(){var c=center(this);SFX.win();burst(c[0],c[1],["💎","✨","💖","🌸"],18,140);setTimeout(function(){renderMenu();show("menu")},600)};
function showOv(ico,t,m,btns){ov.innerHTML='<div class="gl"><div class="big">'+ico+'</div><h2 class="ttl">'+t+'</h2><p>'+m+'</p><div></div></div>';
 var box=ov.lastChild.lastChild;btns.forEach(function(b){var e=document.createElement("button");e.className="btn";e.textContent=b[0];e.onclick=b[1];box.appendChild(e)});ov.classList.add("on")}
function win(m){if(won)return;won=true;done[cur]=1;halt();
 tm(function(){var b=[["⬅ رجوع لقائمة المراحل",toMenu]];if(done.every(Boolean))b.push(["💌 افتحي رسالتك",toFinal]);
  SFX.win();showOv("👑","برافو يا ماس!",m,b);cf(60)},600)}
function hud(a,b){return '<div class="gl hud"><span>'+a+'</span><span>'+b+'</span></div>'}
var G=[];

G[0]=function(){var f=[],lock=false,m=0,e=0,em=["💎","🌹","🦋","👑","🌙","💖"],c=em.concat(em).sort(function(){return Math.random()-.5});
 gb.innerHTML=hud('أخطاء: <b id="ee">0</b>','تطابق: <b id="mm">0</b>/6')+'<div class="mg"></div>';var g=gb.querySelector(".mg");
 c.forEach(function(v){var d=document.createElement("div");d.className="cd";d.dataset.v=v;
  d.innerHTML='<div class="in"><div class="fc bk">💎</div><div class="fc ft">'+v+'</div></div>';
  d.onclick=function(){if(lock||won||d.classList.contains("fl"))return;d.classList.add("fl");SFX.flip();f.push(d);if(f.length<2)return;lock=true;var a=f[0],b=f[1];f=[];
   if(a.dataset.v===b.dataset.v){tm(function(){[a,b].forEach(function(x){var p=center(x);burst(p[0],p[1],["💖","💎","✨"],9,80);x.classList.add("ok")});
     SFX.match();m++;$("#mm").textContent=m;lock=false;if(m>=6)win("طابقتي كل الكروت… زي ما ضحكتك بتطابق الفرحة 💎")},500)}
   else{tm(function(){a.classList.add("bad");b.classList.add("bad");SFX.wrong()},450);
    tm(function(){a.classList.remove("fl","bad");b.classList.remove("fl","bad");e++;$("#ee").textContent=e;lock=false},950)}};
  g.appendChild(d)})};
