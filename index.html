<title>اعرف الجواب</title>

<style>
:root{color-scheme:dark;--bg:#070609;--card:#0f0d14;--card2:#17131f;--line:#2e2740;--txt:#f4efe6;--mut:#a39bb5;--g1:#f6e2ae;--g2:#d4a853;--g3:#8f6a2a;--gold:linear-gradient(120deg,#f6e2ae,#d4a853 45%,#8f6a2a 70%,#f0d18a);--vio:#6d4cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:'Almarai',system-ui,sans-serif}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0,#2a1d4a 0,transparent 55%),radial-gradient(ellipse at 50% 110%,#3a2a12 0,transparent 55%),var(--bg)}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(45deg,#ffffff05 0 2px,transparent 2px 14px);pointer-events:none}
#floaty{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#floaty i{position:absolute;bottom:-20px;width:3px;height:3px;border-radius:50%;background:var(--g1);box-shadow:0 0 8px 2px #f6e2ae88;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(30px)}}
#app{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.screen{display:none;width:100%;max-width:470px;text-align:center}
.screen.on{display:block;animation:pop .6s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.gm{background:var(--gold);background-size:200% 100%;animation:gs 6s linear infinite}
@keyframes gs{to{background-position:200% 0}}
.card{position:relative;background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid #d4a85340;border-radius:6px;padding:40px 22px 30px;box-shadow:0 30px 70px #000c,0 0 0 5px #0a0810,0 0 0 6px #d4a85333}

.fl.bt{transform:scaleY(-1);margin:10px auto 0}
.logo{width:136px;height:136px;margin:4px auto 0;display:block}
.r1{transform-origin:68px 68px;animation:spin 20s linear infinite}.r2{transform-origin:68px 68px;animation:spin 12s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.qm{transform-origin:68px 68px;animation:bob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:scale(1.08)}}
h1{font-family:'Aref Ruqaa',serif;font-size:clamp(52px,17vw,78px);margin:0;font-weight:700;line-height:1.3;-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:2px 0 26px;font-size:17px;letter-spacing:.3px}
button{font-family:inherit;cursor:pointer;border:0}
.btn{position:relative;overflow:hidden;background:var(--gold);background-size:200% 100%;color:#1a1204;font-size:20px;font-weight:800;padding:15px 46px;border-radius:4px;box-shadow:0 10px 30px #d4a85344,inset 0 1px 0 #fff8;transition:transform .15s;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{to{left:130%}}
.btn:active{transform:scale(.95)}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-inline-start:8px}
.btn.alt{background:#1c1726;color:var(--g1);box-shadow:inset 0 0 0 1px #d4a85355}.btn.alt::after{display:none}
.tabs{display:flex;gap:4px;margin-bottom:22px}
.tab{position:relative;flex:1;height:38px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#6f6785;background:#120f19;border:2px solid;border-color:#3a3250 #0a080e #0a080e #3a3250;overflow:hidden}
.tab i{position:absolute;inset:0 0 0 auto;width:0;background:var(--gold);transition:width .7s cubic-bezier(.3,.9,.3,1)}
.tab span{position:relative;z-index:1;transition:color .4s}
.tab.on{color:var(--g1);border-color:#d4a853 #5c4416 #5c4416 #d4a853}
.tab.d span{color:#1a1204}.tab.d i{width:100%}
.q{font-family:'Aref Ruqaa',serif;font-size:clamp(28px,8vw,36px);font-weight:700;line-height:1.7;margin:0 0 20px;min-height:52px;color:var(--g1)}

.frame .in{position:absolute;inset:10.5%;background:#0a080e;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 30px #000}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame img:not([src]),.frame img[src=""]{display:none}
.frame .ph{width:42px;opacity:.25}
.frame img[src]:not([src=""]) ~ .ph{display:none}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:10px;background:#16121e;color:var(--txt);border:1px solid #d4a85333;border-radius:4px;padding:12px;font-size:21px;font-weight:800;text-align:right;transition:.2s;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.opt .lt{flex:none;width:32px;height:32px;transform:rotate(45deg);border:1.5px solid var(--g2);display:grid;place-items:center;color:var(--g1);font-size:15px;margin-inline:3px}
.opt .lt b{transform:rotate(-45deg);font-weight:800}
.opt:hover{background:#1f1829;box-shadow:inset 0 0 0 1px var(--g2)}
.opt:active{transform:scale(.94)}
.opt.pick{background:var(--gold);color:#1a1204;transform:scale(1.04);box-shadow:0 8px 26px #d4a85355}
.opt.pick .lt{border-color:#1a1204;color:#1a1204}
.opt:disabled{opacity:.45}.opt.pick:disabled{opacity:1}
.toast{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;min-height:32px;font-size:18px;font-weight:800;color:var(--g1);opacity:0;transform:translateY(10px);transition:.35s}
.toast.on{opacity:1;transform:none}.toast svg{width:22px;height:22px;flex:none}
.chip{display:inline-block;font-size:14px;font-weight:800;letter-spacing:.5px;color:var(--g1);border:1px solid #d4a85366;padding:4px 18px;margin-bottom:6px}
.lines{padding:14px 4px 4px;min-height:260px}
.ln{font-family:'Amiri','Almarai',serif;font-weight:700;font-size:clamp(22px,6.4vw,27px);line-height:1.9;color:#f4efe6;opacity:0;transform:translateY(14px);filter:blur(6px);transition:opacity .9s ease,transform .9s ease,filter .9s ease}
.ln.on{opacity:1;transform:none;filter:none}
.ln.hl{color:var(--g1)}
.reply{display:none;margin-top:18px;text-align:right}
.reply.on{display:block;animation:pop .6s}
.reply h3{font-family:'Aref Ruqaa',serif;margin:0 0 12px;font-size:26px;text-align:center;color:var(--g1)}
textarea{width:100%;min-height:160px;resize:vertical;background:#0b0910;border:1px solid #d4a85344;border-radius:4px;color:var(--txt);font:400 20px/1.9 'Amiri','Almarai',serif;padding:14px;outline:none;transition:.2s}
textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px #d4a85322}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn.sm{font-size:18px;padding:13px 36px}
.done{display:none;text-align:center;margin-top:16px;font-family:'Aref Ruqaa',serif;font-size:26px;color:var(--g1)}
.done svg{width:54px;height:54px;display:block;margin:0 auto 4px}
#snd{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:5;width:46px;height:46px;background:#120f19;border:1px solid #d4a85355;display:grid;place-items:center;transform:rotate(45deg)}
#snd svg{width:22px;height:22px;transform:rotate(-45deg)}
.cf{position:fixed;top:-20px;z-index:4;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(540deg);opacity:.3}}
</style>

  <i class="cn gm a"></i><i class="cn gm b"></i><i class="cn gm c"></i><i class="cn gm d"></i>
  <i class="fl gm"></i>
  <svg class="logo" viewBox="0 0 136 136" fill="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6e2ae"/><stop offset=".5" stop-color="#d4a853"/><stop offset="1" stop-color="#8f6a2a"/></linearGradient></defs>
    <circle class="r1" cx="68" cy="68" r="62" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle class="r2" cx="68" cy="68" r="50" stroke="#d4a853" stroke-opacity=".5" stroke-dasharray="26 14"/>
    <path d="M68 24l32 44-32 44-32-44z" fill="#130f1b" stroke="url(#g)" stroke-width="2.5"/>
    <text class="qm" x="68" y="86" text-anchor="middle" font-family="Aref Ruqaa,serif" font-weight="700" font-size="52" fill="url(#g)">؟</text>
  </svg>
  <h1 class="gm">اعرف الجواب</h1>
  <p class="sub">أسئلة سريعة... وكلها ليكي</p>
  <button class="btn" id="start">يلا نبدأ<svg viewBox="0 0 24 24" fill="none" stroke="#1a1204" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
  <i class="fl gm bt"></i>
</div></section>

<section class="screen" id="s-quiz"><div class="card">
  <i class="cn gm a"></i><i class="cn gm b"></i><i class="cn gm c"></i><i class="cn gm d"></i>
  <div class="tabs" id="tabs"></div>
  <!-- إطار الصورة: ضع الصورة في QUESTIONS (img) -->
  <div class="frame" id="frame" style="display:none"><div class="fr"></div><div class="in">
    <img id="qimg" src="" alt="">
    <svg class="ph" viewBox="0 0 24 24" fill="none" stroke="#f6e2ae" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
  </div></div>
  <div class="q" id="qtext"></div>
  <div class="ans" id="ans"></div>
  <div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="#d4a853" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-7"/></svg><span id="tt"></span></div>
</div></section>

<section class="screen" id="s-final"><div class="card">
  <i class="cn gm a"></i><i class="cn gm b"></i><i class="cn gm c"></i><i class="cn gm d"></i>
  <i class="fl gm"></i>
  <span class="chip">رسالة ليكي</span>
  <div class="lines" id="lines"></div>
  <i class="fl gm bt"></i>
  <div class="reply" id="reply">
    <h3>حابة تكتبي إيه قبل ما تنهي الموقع؟</h3>
    <textarea id="mine" placeholder="اكتبي هنا..."></textarea>
    <div class="row"><button class="btn sm" id="send">إرسال</button></div>
    <div class="done" id="done">
      <svg viewBox="0 0 56 56" fill="none"><path d="M28 3l25 25-25 25L3 28z" stroke="#d4a853" stroke-width="2.5"/><path d="M17 29l8 8 15-17" stroke="#f6e2ae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      وصلت بنجاح
      <div class="row"><button class="btn sm alt" id="share">شاركيها معايا</button></div>
    </div>
  </div>
</div></section>
</div>

<script>
/* ============ الإعدادات: عدّل هنا ============ */
const STD = ["ماس","مسمس","ماسو","ماسي"];
const QUESTIONS = [
  { text: "مين هيا اكبر قحبه ؟ ", options: ["جمان","جمان","جمان","جمان"] },   // السؤال الأول فارغ - اكتبه بنفسك
  { text: "مين امز واحده ف كوكب", options: STD },
  { text: "مين ده القمر", options: STD, img: "Mas. img" },        // ضع مسار الصورة هنا مثل: img: "photo.jpg"
  { text: "مين الي بنات العالم كله يغار منها ؟", options: STD }
];
/* الرسالة النهائية: نفس الكلمات بالضبط، مقسمة سطور فقط للظهور سطر سطر */
const FINAL_LINES = [
 "اسمعي يا بنتي",
 "لا تقولي علي نفسك رخيصه تاني",
 "عشان لا اجيك العراق اقتلك يابنتي",
 "لا تزعلي عشان حيوانه زي دي",
 "وربي اني بحاول اجيب ليكي حسابها بنت الوسخه ذي",
 "ولما القيه وربي بهين عرضها",
 "اهم شي لا تكوني زعلانه او مخنوقه",
 "ووعد مني بجيب ليكي حقك يا بنتي",
 "وربي كل ذا حصلك عشان يغيور منك",
 "عشانك اجمل واحسن وافضل منهم",
  "ولا تزعلي نفسك عشان قحبه زي دي",
 "فديتك يعم",
 "وربي اني محظوظ اني اعرف مزه زيك كده"
];
const NICE = ["إجابة جامدة جدا","صح عليكي، عارفة نفسك","ولا غلطة، كلها صح","ذكية زي العادة","تمام التمام","يا سلام عليكي","كل الإجابات عندك صح"];
const LETTERS = ["أ","ب","ج","د"];

/* ============ الصوت (مولّد داخليا) ============ */
let ac=null, master=null, muted=false, musicOn=false, musicTimer=null, step=0;
function initAudio(){ try{ if(!ac){ const C=window.AudioContext||window.webkitAudioContext; ac=new C(); master=ac.createGain(); master.gain.value=.8; master.connect(ac.destination);} if(ac.state==='suspended') ac.resume(); }catch(e){} }
function tone(f,d,type='sine',v=.15,delay=0,slide=0){
  if(!ac||muted) return;
  try{ const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);
  }catch(e){}
}
const SFX={
  click(){tone(660,.09,'triangle',.14);tone(880,.09,'triangle',.1,.05)},
  pick(){tone(520,.12,'square',.07);tone(780,.14,'square',.07,.07)},
  ok(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'sine',.14,i*.09))},
  next(){tone(300,.25,'sawtooth',.05,0,700)},
  line(){tone(988,.35,'sine',.07);tone(1480,.4,'sine',.04,.06)},
  fin(){[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.12,i*.1))}
};
const LEAD=[523,0,659,784,659,0,587,0,523,0,659,880,784,0,659,0,587,0,698,880,698,0,659,0,587,659,523,0,392,0,0,0];
const BASS=[131,131,196,196,175,175,196,196];
function musicStep(){ if(muted||!musicOn) return; const n=LEAD[step%LEAD.length]; if(n) tone(n,.22,'triangle',.045); if(step%4===0) tone(BASS[(step/4)%BASS.length|0],.45,'sine',.07); if(step%2===1) tone(1800,.03,'square',.008); step++; }
function startMusic(){ if(musicTimer) return; musicOn=true; musicTimer=setInterval(musicStep,230); }
function stopMusic(){ musicOn=false; clearInterval(musicTimer); musicTimer=null; }
const IC=c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/>`;
const ICON_ON=IC('#f6e2ae')+'<path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>';
const ICON_OFF=IC('#8a8097')+'<path d="M22 9l-6 6M16 9l6 6"/></svg>';
const sndBtn=document.getElementById('snd'); sndBtn.innerHTML=ICON_ON;
sndBtn.onclick=()=>{ initAudio(); muted=!muted; sndBtn.innerHTML=muted?ICON_OFF:ICON_ON; if(!muted){startMusic();SFX.click();} else stopMusic(); };

/* ============ أدوات ============ */
const $=id=>document.getElementById(id);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); window.scrollTo({top:0,behavior:'smooth'}); }
function confetti(n=20){
  const cols=['#f6e2ae','#d4a853','#8f6a2a','#8b6dff','#fff'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span'); s.className='cf'; const z=6+Math.random()*9;
    s.style.width=z+'px'; s.style.height=z+'px'; s.style.background=cols[i%cols.length]; s.style.left=Math.random()*100+'vw';
    const k=i%3; if(k===0) s.style.borderRadius='50%'; if(k===1) s.style.transform='rotate(45deg)';
    if(k===2) s.style.clipPath='polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)';
    s.style.animationDelay=Math.random()*.5+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),2900);
  }
}
(function(){ const f=$('floaty'); for(let i=0;i<30;i++){ const s=document.createElement('i'); s.style.left=Math.random()*100+'%'; s.style.animationDuration=(12+Math.random()*16)+'s'; s.style.animationDelay=(-Math.random()*24)+'s'; s.style.opacity=.3+Math.random()*.7; f.appendChild(s);} })();

/* ============ المنطق ============ */
let qi=0, locked=false;
const N=QUESTIONS.length;
$('start').onclick=()=>{ initAudio(); SFX.click(); startMusic(); buildTabs(); loadQ(); show('s-quiz'); };
function buildTabs(){ $('tabs').innerHTML=QUESTIONS.map((_,i)=>`<div class="tab"><i></i><span>${i+1}</span></div>`).join(''); }
function setTabs(cur,done){ [...$('tabs').children].forEach((t,i)=>{ t.classList.toggle('on',i===cur); t.classList.toggle('d',i<done); }); }
function loadQ(){
  locked=false; const q=QUESTIONS[qi];
  $('qtext').textContent=q.text;
  const fr=$('frame'); if('img' in q){ fr.style.display='block'; if(q.img) $('qimg').src=q.img; } else fr.style.display='none';
  setTabs(qi,qi); $('toast').classList.remove('on'); $('ans').innerHTML='';
  q.options.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.innerHTML=`<span class="lt"><b>${LETTERS[i]}</b></span><span></span>`; b.lastChild.textContent=o; b.onclick=()=>pick(b); $('ans').appendChild(b); });
}
function pick(b){
  if(locked) return; locked=true; initAudio(); b.classList.add('pick');
  document.querySelectorAll('.opt').forEach(x=>x.disabled=true); SFX.pick();
  setTimeout(()=>{ SFX.ok(); confetti(14); setTabs(qi,qi+1); $('tt').textContent=NICE[(qi*2+Math.floor(Math.random()*3))%NICE.length]; $('toast').classList.add('on'); },250);
  setTimeout(()=>{ SFX.next(); qi++; if(qi>=N){ finale(); return; } const c=$('s-quiz'); c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); loadQ(); },1900);
}
function finale(){
  show('s-final'); SFX.fin(); confetti(30);
  const box=$('lines'); box.innerHTML='';
  const els=FINAL_LINES.map((t,i)=>{ const d=document.createElement('div'); d.className='ln'+(i===FINAL_LINES.length-1||i===10?' hl':''); d.textContent=t; box.appendChild(d); return d; });
  let i=0;
  (function next(){
    if(i>=els.length){ setTimeout(()=>$('reply').classList.add('on'),900); return; }
    els[i].classList.add('on'); SFX.line();
    const len=FINAL_LINES[i].length; i++;
    setTimeout(next,1300+len*45);
  })();
}
$('send').onclick=()=>{ initAudio(); SFX.click(); const v=$('mine').value.trim(); if(!v){ $('mine').focus(); return; }
  $('mine').readOnly=true; $('send').disabled=true; $('send').style.opacity=.5; $('done').style.display='block'; SFX.ok(); confetti(26); };
$('share').onclick=async()=>{ SFX.click(); const v=$('mine').value.trim();
  try{ if(navigator.share) await navigator.share({text:v}); else { await navigator.clipboard.writeText(v); $('share').textContent='اتنسخت'; } }catch(e){} };
</script>
</body>
</html>
